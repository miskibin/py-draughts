name: Release

# Creates the git tag and GitHub release for the version in pyproject.toml,
# with notes taken from that version's "## <version>" section in changelog.md.
# Runs when the version is bumped on main (or on manual dispatch) and does
# nothing if the tag already exists. The "Upload Python Package" workflow
# picks up the new release via workflow_run and publishes to PyPI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and check tag
        id: v
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then echo "Could not read version from pyproject.toml" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract changelog section
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.v.outputs.version }}" '$0 == "## " ver {flag=1; next} /^## /{flag=0} flag' changelog.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "No changelog section found for version ${{ steps.v.outputs.version }}" >&2
            exit 1
          fi
      - name: Create tag and GitHub release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file /tmp/notes.md
